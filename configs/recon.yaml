# The reconstruction pipeline's parameters. One file, not one per arm.
#
# There used to be eleven of these under configs/conditions/, one per row of the
# paper's tables. Every one of them declared the same K, the same iteration count, the
# same seeds and the same artifacts, because that is the point: the arms differ in
# which particles reach the chain, never in what the chain does to them. Comparing two
# resolutions produced under different class_2D parameters would not be an ablation of
# the selection, so there is one file and the arms cannot drift apart.
#
# What distinguishes an arm is therefore not here. It is the STAR (or the 2D selection)
# handed to the driver, and the --name it is recorded under:
#
#   reconstruct.sh --entry 10081 --star $RAPICK_WORK/picks/10081/cryotransformer_mask.star \
#                  --name cryotransformer_mask
#
# docs/CONDITIONS.md lists the arms the paper reports and what each one is.

name: recon

pipeline:

  class2d:
    class2D_K: 50                 # 50 classes, the same K in every arm and in the
    class2D_num_full_iter: 20     # CryoSift cycles, so the stacks stay comparable

  reconstruction:
    # Best-of-3, which is the paper's protocol (Sec. 4.2): the reconstruction runs three
    # times with different random seeds and the best of the three by GSFSC 0.143 is what
    # is reported. `--seeds 0,1,2` must be passed explicitly on every run and collect --
    # this block is documentation, not enforced config, so a single-seed run is always a
    # deliberate choice rather than a silent default.
    seeds: [0, 1, 2]
    choose_best_by: res_gsfsc_0143
    # Note on particle counts: homo_abinit clamps its input at a per-entry particle cap
    # (measured 219,900 on 10081, 176,700 on 10532), so the refine particle count can be
    # lower than the extract count. Two arms are comparable on particle count only when
    # NEITHER is clamped; a comparison straddling the cap is confounded. `collect`
    # records the used/unused split in metrics.json so the clamp stays visible.

  local_resolution:
    # On the best-of-3 winner only. `reconstruct.sh --no-local-res` turns it off for a
    # run that only needs the resolution number: the perfect-teacher arm (fb_gt) is
    # reported without a local-resolution map.
    enabled: true

artifacts:
  particle_counts: true
  ctf_summary: true
  gsfsc: true
  mirror_final_maps: false        # the CryoSPARC job directory stays the source of truth
