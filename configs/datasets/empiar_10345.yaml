# EMPIAR-10345 — integrin alpha-V beta-8. One file per entry, covering both scales.
#
# Produces: the 10345 row of Table 1 (entry, diameter, pixel size, micrograph counts),
# and supplies the micrographs and picks behind every 10345 number in Table 2, Table 4,
# Table 5, Table 8, Fig. 3, Fig. S6 and Fig. S7.
#
# `annot` is the 300 CryoPPP-annotated micrographs; `full` is the whole deposition.
# Every reconstruction-level result of the paper uses `full` — 300 micrographs are not
# enough for a stable reconstruction. `annot` reconstructs the CryoPPP annotations
# themselves (condition `gt`, Fig. S6 and Fig. S7), which exist only for those 300.
#
# Paths come from $RAPICK_DATA (downloaded inputs) and $RAPICK_WORK (what this pipeline
# and the earlier stages produce); see docs/CONFIGURATION.md. Nothing here is absolute.
name: empiar_10345
empiar_id: "10345"

# Optics, from the CryoPPP ground-truth STAR's data_optics block. Shared by both scales,
# so a change of scale is never also a change of optics.
# `total_dose_e_per_A2` is not in that block; the micrographs are already motion-corrected
# and dose-weighted, so it only labels the import.
#
# PIXEL-SIZE CAVEAT, EMPIAR-10345 ONLY. `psize_A: 0.673` is the value CryoPPP declares,
# and it is the SUPER-RESOLUTION MOVIE figure. The micrographs themselves are the
# 2x-binned ones at 1.345 A, which the EMPIAR image set, the authors' own particle stack
# and EMD-20795's voxel size all agree on. This project deliberately follows CryoPPP so
# that every entry uses CryoPPP-sourced optics, and the consequence is that EVERY 10345
# resolution reported here is about HALF the physical figure: multiply by about two before
# comparing it against EMDB or against a paper that declared 1.345, and note that any
# angstrom-valued refinement parameter lands at half the intended frequency. Resolutions
# on this entry compare conditions WITHIN the entry and nothing else. Coordinates and
# `box_size_pix` are unaffected.
#
# The tell is Patch CTF: a pixel size understated by a factor s fits every defocus s^2
# low, and 10345's median 0.512 um x 4 = 2.05 um lands in family with the other entries'
# 2.0-2.6 um.
optics:
  psize_A: 0.673
  accel_kv: 300
  cs_mm: 2.7
  total_dose_e_per_A2: 50.0

extraction:
  box_size_pix: 300          # particle diameter 149 px

settings:

  # --- the 300 CryoPPP-annotated micrographs -----------------------------------
  annot:
    micrographs: "${RAPICK_DATA}/cryoppp/10345/micrographs/*.mrc"
    expected_micrograph_count: 300
    sources:
      # The CryoPPP expert annotations. `query_cut_prefix: 22` strips the 22-character
      # CryoSPARC "<21-digit uid>_" prefix this STAR carries on its micrograph names, so
      # they reduce to the same basename as the imported micrographs (which are stripped
      # from the other side by the profile's `remove_leading_uid`).
      # `y_flip: true`: Import Particles does NOT flip Y, and every GT-aligned STAR in
      # this project uses a top-left Y origin, so Y is rewritten to ny - Y before import.
      gt:
        star: "${RAPICK_DATA}/cryoppp/10345/ground_truth/empiar-10345_particles_selected.star"
        import_params: { query_cut_prefix: 22 }
        y_flip: true

  # --- the whole deposition ------------------------------------------------------
  full:
    micrographs: "${RAPICK_DATA}/cryoppp_fullset/10345/micrographs/*.mrc"
    # 1,644 micrographs. Verify the count that Patch CTF actually completed on:
    # a `completed` Patch CTF has been observed here while silently dropping micrographs,
    # and nothing downstream signals the loss. `import_particles` also dies on the first
    # micrograph its STAR names but cannot find, and a `*.mrc` glob happily imports a
    # partial download.
    expected_micrograph_count: 1644
    # The STARs the paper's own arms read, named by the stages their picks have been
    # through. The picker STARs use raw micrograph basenames, so no query_cut_prefix;
    # all carry the top-left Y origin.
    #
    # An arm that selects 2D classes is NOT listed: it carries no picks of its own and
    # reconstructs the selection over another arm's class_2D. Nor is a STAR this file
    # does not name unrunnable -- every driver takes a --star, and declares it for the
    # length of the run (docs/CONDITIONS.md).
    sources:
      # CryoTransformer's candidates from the base checkpoint (Sec. S2's theta_0).
      cryotransformer:
        star: "${RAPICK_WORK}/picks/10345/cryotransformer.star"
        import_params: {}
        y_flip: true
      # The same candidates, minus those whose centre lands on contamination under the
      # triangular-blend MicrographCleaner mask (src/rapick/cleaner/).
      cryotransformer_mask:
        star: "${RAPICK_WORK}/picks/10345/cryotransformer_mask.star"
        import_params: {}
        y_flip: true
      # The round-1 fine-tuned checkpoint's candidates, through the same mask. This is
      # the stack the paper's method (Ours) classifies and then selects on; the
      # selection over it is the arm recorded as `fb`.
      fb_mask:
        star: "${RAPICK_WORK}/picks/10345/fb_mask.star"
        import_params: {}
        y_flip: true
      # The same, but from the checkpoint fine-tuned on the CryoPPP annotations instead
      # of on the surviving picks. The perfect-teacher upper bound of Table 7's lower row.
      fb_gt_mask:
        star: "${RAPICK_WORK}/picks/10345/fb_gt_mask.star"
        import_params: {}
        y_flip: true
      # The three comparison pickers, raw picks, no purification (Table 2).
      cryolo:
        star: "${RAPICK_WORK}/picks/10345/cryolo.star"
        import_params: {}
        y_flip: true
      topaz:
        star: "${RAPICK_WORK}/picks/10345/topaz.star"
        import_params: {}
        y_flip: true
      cryosegnet:
        star: "${RAPICK_WORK}/picks/10345/cryosegnet.star"
        import_params: {}
        y_flip: true
