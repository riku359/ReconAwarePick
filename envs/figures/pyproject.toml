[project]
# The shared plotting and file-reading environment: the download scripts under
# src/rapick/data/ and the stage-level plotting scripts (the cleaner's overlays
# and post-processing panels, select2d's selection panels) run in it. It needs no
# GPU and no CryoSPARC connection: every script here reads files that an earlier
# stage already wrote.
name = "rapick-figures"
version = "0.1.0"
description = "Plotting and download helpers for Reconstruction-Aware Cryo-EM Particle Picking"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "mrcfile>=1.5",          # reading .mrc volumes and micrographs
    "pillow>=10.0",          # panel tiling
    "opencv-python>=4.9",    # overlay rendering, shared with the eval utilities
    "pypdf>=4.0",            # cropping the hand-drawn figures after LibreOffice
    "python-pptx>=0.6.23",   # the two hand-drawn figures are built from pptx
]
