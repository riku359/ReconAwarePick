[project]
name = "rapick-cryotransformer-env"
version = "0.0.0"
description = "Independent uv environment for the CryoTransformer cryo-EM particle picker. Upstream is script-based (run from ../../cryotransformer); this project only provides the dependency closure."
requires-python = ">=3.7.1,<3.8"
dependencies = [
    # Pinned from upstream environment.yml. torch 1.13.1 / torchvision 0.14.1
    # use cu117 wheels (compatible with host driver 535.230.02 / CUDA 12.2 and
    # RTX 3090 sm_86; CUDA 11.7 wheels run under a 12.2 driver).
    "torch==1.13.1",
    "torchvision==0.14.1",
    "numpy==1.21.6",
    # Upstream pins pandas==0.24.2, but that release ships PEP 440-invalid
    # metadata ("pytz (>=2011k)") that uv refuses to parse. 1.3.5 is the last
    # pandas supporting Python 3.7 and has valid metadata. DOCUMENTED DEVIATION.
    "pandas==1.3.5",
    "scipy==1.7.3",
    "opencv-python==4.7.0.72",
    "matplotlib==3.5.3",
    "mrcfile==1.4.3",
    "pycocotools==2.0.6",
    "scikit-image==0.18.0",
    "scikit-learn==1.0.2",
    "starfile==0.4.10",
    "starparser==1.41",
    "pillow==9.4.0",
    "tqdm==4.64.1",
    "torchinfo==1.7.2",
    # Logging dep from environment.yml (not needed for prediction, kept for fidelity).
    "wandb==0.13.10",
]

[tool.uv.sources]
torch = { index = "pytorch-cu117" }
torchvision = { index = "pytorch-cu117" }

[[tool.uv.index]]
name = "pytorch-cu117"
url = "https://download.pytorch.org/whl/cu117"
explicit = true
