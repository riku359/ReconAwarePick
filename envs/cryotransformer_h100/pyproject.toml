[project]
name = "rapick-cryotransformer-h100-env"
version = "0.0.0"
description = "Training CryoTransformer on a Hopper GPU. envs/cryotransformer pins torch 1.13.1+cu117, whose kernels stop at sm_86, so on an H100 (sm_90) convolutions and the random number generator silently return zeros instead of failing. Train in this environment; keep inference and evaluation in envs/cryotransformer. The paper's own runs used A5000 cards and needed neither."
requires-python = ">=3.10,<3.11"
dependencies = [
    # The first stable series carrying sm_90: it appears in torch.cuda.get_arch_list().
    "torch==2.0.1",
    "torchvision==0.15.2",
    # models/backbone.py calls torchvision with pretrained=. 0.15.2 still accepts it,
    # with a deprecation warning, and is the last version that does, so pinning here
    # avoids having to change upstream code.
    "numpy==1.24.4",
    "scipy==1.10.1",
    "pycocotools==2.0.7",
    "pillow==9.5.0",
    "packaging==23.2",
    "tqdm==4.66.1",
    "wandb==0.16.6",
]

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true
